<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">How smart-ripgrep builds and uses repository knowledge</title>
  <desc id="desc">The ripgrep repository goes through GitSense Chat, which packages analysis as committed JSON manifests. After cloning, gsc imports the manifests into local SQLite Brains that coding agents query.</desc>
  <rect width="1600" height="900" fill="#ffffff"/>

  <text x="800" y="58" fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" text-anchor="middle">HOW SMART-RIPGREP CARRIES KNOWLEDGE</text>

  <text x="70" y="118" fill="#555555" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">BUILD AND PACKAGE</text>
  <line x1="70" y1="136" x2="1530" y2="136" stroke="#d0d0d0" stroke-width="2"/>

  <rect x="70" y="175" width="360" height="260" rx="6" fill="#fafafa" stroke="#111111" stroke-width="3"/>
  <text x="250" y="220" fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="middle">ripgrep repository</text>
  <text x="112" y="270" fill="#333333" font-family="Menlo, Consolas, monospace" font-size="20">crates/core/</text>
  <text x="112" y="308" fill="#333333" font-family="Menlo, Consolas, monospace" font-size="20">crates/ignore/</text>
  <text x="112" y="346" fill="#333333" font-family="Menlo, Consolas, monospace" font-size="20">crates/searcher/</text>
  <text x="112" y="384" fill="#777777" font-family="Menlo, Consolas, monospace" font-size="20">tests/  Cargo.toml  ...</text>
  <text x="250" y="414" fill="#555555" font-family="Arial, Helvetica, sans-serif" font-size="17" text-anchor="middle">The unchanged source is the input</text>

  <path d="M450 305 H520" fill="none" stroke="#111111" stroke-width="4"/>
  <path d="M520 305 l-14 -10 v20 z" fill="#111111"/>

  <rect x="540" y="175" width="420" height="260" rx="6" fill="#eef7f5" stroke="#167c6b" stroke-width="4"/>
  <text x="750" y="220" fill="#0f5f52" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="middle">GitSense Chat</text>
  <text x="750" y="270" fill="#222222" font-family="Arial, Helvetica, sans-serif" font-size="21" text-anchor="middle">Define what matters</text>
  <text x="750" y="308" fill="#222222" font-family="Arial, Helvetica, sans-serif" font-size="21" text-anchor="middle">Analyze the repository</text>
  <text x="750" y="346" fill="#222222" font-family="Arial, Helvetica, sans-serif" font-size="21" text-anchor="middle">Review and refine</text>
  <text x="750" y="384" fill="#222222" font-family="Arial, Helvetica, sans-serif" font-size="21" text-anchor="middle">Package the results</text>
  <text x="750" y="414" fill="#0f5f52" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Managed analysis happens here</text>

  <path d="M980 305 H1050" fill="none" stroke="#111111" stroke-width="4"/>
  <path d="M1050 305 l-14 -10 v20 z" fill="#111111"/>

  <rect x="1070" y="175" width="460" height="260" rx="6" fill="#fafafa" stroke="#111111" stroke-width="3"/>
  <text x="1300" y="220" fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="middle">Committed with smart-ripgrep</text>
  <text x="1110" y="266" fill="#333333" font-family="Menlo, Consolas, monospace" font-size="19">.gitsense/manifests/</text>
  <text x="1140" y="301" fill="#333333" font-family="Menlo, Consolas, monospace" font-size="18">code-intent.json</text>
  <text x="1140" y="334" fill="#333333" font-family="Menlo, Consolas, monospace" font-size="18">implicit-todos.json</text>
  <text x="1140" y="367" fill="#333333" font-family="Menlo, Consolas, monospace" font-size="18">rust-blast-radius.json</text>
  <text x="1140" y="400" fill="#777777" font-family="Menlo, Consolas, monospace" font-size="18">...and two more</text>
  <text x="1445" y="414" fill="#555555" font-family="Arial, Helvetica, sans-serif" font-size="17" text-anchor="end">Portable JSON</text>

  <rect x="190" y="472" width="1220" height="72" rx="6" fill="#111111"/>
  <text x="800" y="517" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="middle">Once the manifests are committed, agents only need gsc.</text>

  <text x="70" y="606" fill="#555555" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">USE ON ANY CLONE</text>
  <line x1="70" y1="624" x2="1530" y2="624" stroke="#d0d0d0" stroke-width="2"/>

  <rect x="70" y="662" width="330" height="170" rx="6" fill="#fafafa" stroke="#111111" stroke-width="3"/>
  <text x="235" y="708" fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="middle">Clone the repository</text>
  <text x="235" y="754" fill="#333333" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle">Source + committed manifests</text>
  <text x="235" y="792" fill="#555555" font-family="Arial, Helvetica, sans-serif" font-size="17" text-anchor="middle">The knowledge travels with the code</text>

  <path d="M420 747 H480" fill="none" stroke="#111111" stroke-width="4"/>
  <path d="M480 747 l-14 -10 v20 z" fill="#111111"/>

  <rect x="500" y="662" width="310" height="170" rx="6" fill="#fff7e8" stroke="#ad6c00" stroke-width="4"/>
  <text x="655" y="708" fill="#7a4c00" font-family="Menlo, Consolas, monospace" font-size="27" font-weight="700" text-anchor="middle">gsc</text>
  <text x="655" y="754" fill="#222222" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle">Import manifests</text>
  <text x="655" y="788" fill="#222222" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle">Build local Brains</text>

  <path d="M830 747 H890" fill="none" stroke="#111111" stroke-width="4"/>
  <path d="M890 747 l-14 -10 v20 z" fill="#111111"/>

  <rect x="910" y="662" width="300" height="170" rx="6" fill="#fafafa" stroke="#111111" stroke-width="3"/>
  <text x="1060" y="708" fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="middle">Local Brains</text>
  <text x="1060" y="754" fill="#333333" font-family="Menlo, Consolas, monospace" font-size="19" text-anchor="middle">.gitsense/*.db</text>
  <text x="1060" y="792" fill="#555555" font-family="Arial, Helvetica, sans-serif" font-size="17" text-anchor="middle">SQLite · generated · gitignored</text>

  <path d="M1230 747 H1280" fill="none" stroke="#111111" stroke-width="4"/>
  <path d="M1280 747 l-14 -10 v20 z" fill="#111111"/>

  <rect x="1300" y="662" width="230" height="170" rx="6" fill="#fafafa" stroke="#111111" stroke-width="3"/>
  <text x="1415" y="708" fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="middle">Coding agent</text>
  <text x="1415" y="751" fill="#333333" font-family="Menlo, Consolas, monospace" font-size="17" text-anchor="middle">gsc rg</text>
  <text x="1415" y="783" fill="#333333" font-family="Menlo, Consolas, monospace" font-size="17" text-anchor="middle">gsc query</text>
  <text x="1415" y="815" fill="#333333" font-family="Menlo, Consolas, monospace" font-size="17" text-anchor="middle">gsc knowledge</text>

  <text x="800" y="874" fill="#555555" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle">GitSense Chat builds the package. gsc is the local interface agents use afterward.</text>
</svg>
